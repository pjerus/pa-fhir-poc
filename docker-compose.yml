# A Neo4j instance dedicated to this POC. Community edition serves exactly one
# user database, so the POC gets its own container and volumes rather than an
# extra database inside a shared instance.
services:
  neo4j:
    image: neo4j:5-community
    container_name: pa-fhir-poc-neo4j
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:?copy .env.example to .env first}/${NEO4J_PASSWORD:?copy .env.example to .env first}"
      NEO4J_initial_dbms_default__database: "${NEO4J_DATABASE:-pafhirpoc}"
      # Read only by the healthcheck below. Deliberately not NEO4J_-prefixed:
      # the entrypoint treats those as server settings.
      HEALTHCHECK_USER: "${NEO4J_USER}"
      HEALTHCHECK_PASSWORD: "${NEO4J_PASSWORD}"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      # Proves the POC's default database answers, not merely that a port is open.
      test:
        - CMD-SHELL
        - cypher-shell -u "$${HEALTHCHECK_USER}" -p "$${HEALTHCHECK_PASSWORD}" 'RETURN 1' >/dev/null
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  neo4j-data:
  neo4j-logs:
